spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: TMDT
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

    show-sql: ${JPA_SHOW_SQL:true}
jwt:
  secret: ${JWT_SECRET}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
